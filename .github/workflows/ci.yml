name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ui,ocr,evaluation]"
          python -m pip install -e ".\veriwrite-evaluator[mcp]"

      - name: Check public release boundary
        run: python scripts/check_public_release.py

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q
