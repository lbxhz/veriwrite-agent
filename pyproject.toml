[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "veriwrite-agent"
version = "1.0.0"
description = "A verifiable, evidence-grounded course research and writing agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0,<3",
    "pypdf>=6.14,<7",
    "python-docx>=1.2,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.8",
]
ui = [
    "streamlit>=1.59,<2",
    "pywin32==312; sys_platform == 'win32'",
]
ocr = [
    "onnxruntime>=1.27,<2",
    "pypdfium2>=5.12,<6",
    "rapidocr>=3.9,<4",
]

[project.scripts]
veriwrite = "veriwrite_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
